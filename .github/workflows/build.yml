name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project.zip
        run: if [ -f project.zip ]; then unzip -o project.zip -x ".github/*"; fi
      - name: Patch code
        run: sed -i 's/val cy = bb.centerY()$/val cy = bb.centerY().toFloat()/' app/src/main/java/com/example/cryptobot/BotService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Download word lists
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/common.txt https://raw.githubusercontent.com/first20hours/google-10000-english/master/20k.txt
          curl -fsSL -o app/src/main/assets/full.txt https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo '### Build error' >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
            grep -E -A4 "^e: |What went wrong" build.log | sed 's#file:///home/runner/work/cryptobot/cryptobot/app/src/main/java/com/example/cryptobot/##' | fold -w 50 | head -60 >> $GITHUB_STEP_SUMMARY
            echo '~~~' >> $GITHUB_STEP_SUMMARY
          fi
          exit $code
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
